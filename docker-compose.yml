# Backend + Frontend + Ollama (RAG). Levanta todo con: docker compose up -d
services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      # Persistir ChromaDB (índice RAG)
      - ./chroma_db:/app/chroma_db
      # data/ del host: documentos RAG y data/users.json
      - ./data:/app/data
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      # Live reload al editar código (opcional)
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  ollama_models:
