# Backend + Frontend + Ollama (RAG). Levanta todo con: docker compose up -d
services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      # Persistir ChromaDB (índice RAG)
      - ./chroma_db:/app/chroma_db
      # data/ del host: documentos RAG y data/users.json
      - ./data:/app/data
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL}
    volumes:
      # Live reload al editar código (opcional)
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  stripe-listener:
    image: stripe/stripe-cli:latest
    command: >
      listen
      --api-key ${STRIPE_SECRET_KEY}
      --forward-to http://backend:8000/webhooks/stripe
    depends_on:
      - backend
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:latest
    profiles: ["tunnels"]
    command: >
      http --authtoken=${NGROK_AUTHTOKEN}
      --url=${NGROK_URL}
      backend:8000
    ports:
      - "4040:4040"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_models:
